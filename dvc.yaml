stages:
  ingest:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
      - src/config.py
      - data/spam.csv
    outs:
      - data/raw.csv

  validate:
    cmd: python src/data_validation.py
    deps:
      - src/data_validation.py
      - src/config.py
      - data/raw.csv

  preprocess:
    cmd: python src/data_preprocessing.py
    deps:
      - src/data_preprocessing.py
      - src/config.py
      - data/raw.csv
    outs:
      - data/processed.csv
      - models/vectorizer.pkl

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/config.py
      - data/processed.csv
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/config.py
      - data/processed.csv
      - models/model.pkl
    metrics:
      - metrics.json:
          cache: false
